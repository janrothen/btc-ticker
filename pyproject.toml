[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btcticker"
version = "0.1.0"
description = "Bitcoin price ticker for Waveshare 2.13\" e-ink displays on Raspberry Pi"
requires-python = ">=3.13"
dependencies = [
    "requests~=2.33",
    "pillow~=13.0",  # 13.0.0 fixes all advisories known for 12.x (e.g. GHSA-78g4-xqwv-q3g8)
    # Security floors for transitive dependencies of requests. There is no
    # lockfile, so without these an existing venv keeps vulnerable versions
    # on `pip install -e .` because the old ones still satisfy requests.
    "urllib3>=2.8,<3",          # GHSA-mf9v-mfxr-j63j, GHSA-vxq7-64xx-v4gw
    "certifi>=2026.10.18",      # GHSA-6q48-6c7w-9gw2 (compromised eMudhra CAs)
    "idna>=3.15,<4",            # GHSA-65pc-fj4g-8rjx
]

[project.optional-dependencies]
rpi = [
    "spidev~=3.8",
    "gpiozero~=2.0",
    "lgpio~=0.2.2",  # gpiozero backend; built from sdist on 64-bit Pi OS, see deploy/install.sh
    "waveshare-epd @ git+https://github.com/waveshareteam/e-Paper.git@86aa9932f471a50157cf02fafadc2c1b4a965449#subdirectory=RaspberryPi_JetsonNano/python",
]
dev = [
    "pytest>=9.0.3,<10",  # GHSA-6w46-j5rx-g56g
    "pytest-cov~=7.1",
    "pre-commit~=4.5",
    "ruff==0.17.5",  # keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
]

[project.scripts]
btcticker = "btcticker.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/btcticker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/btcticker --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

[tool.coverage.run]
relative_files = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
