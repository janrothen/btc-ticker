[bitcoin.price]
service_endpoint = "https://blockchain.info/ticker"
currency = "USD"          # currency code returned by the API (e.g. "CHF", "EUR")
symbol = "$"              # symbol shown on the display (e.g. "CHF ", "€")
refresh_interval = 300    # seconds between price refreshes

[gpiozero]
# GPIO backend used by gpiozero to drive the display's control pins.
# "lgpio" talks to /dev/gpiochip* directly and needs no daemon.
# "pigpio" (requires the pigpiod daemon) and "rpigpio" remain possible, but
# their libraries are not installed by default. See the gpiozero docs.
pin_factory = "lgpio"
